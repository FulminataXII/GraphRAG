[project]
name = "graphrag"
version = "0.1.0"
description = "Hybrid GraphRAG — production MVP"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # --- web / api ---
    "fastapi==0.141.1",
    "uvicorn[standard]==0.38.0",
    "python-multipart==0.0.32",
    # --- config / validation ---
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    # --- cli ---
    "typer==0.27.1",
    # --- logging ---
    "structlog==26.1.0",
    # --- opentelemetry — pinned exactly. sdk._logs is a private API and breaks on patch bumps. ---
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-redis==0.65b0",
    "opentelemetry-instrumentation-asyncpg==0.65b0",
    "opentelemetry-semantic-conventions==0.65b0",
    # --- async job queue / stores ---
    "arq==0.28.0",
    "redis==5.3.1",  # arq 0.28.0 caps redis<6
    "asyncpg==0.31.0",
    "sqlalchemy==2.0.44",
    "alembic==1.19.1",
    "qdrant-client==1.19.0",
    "neo4j==6.2.0",
    # --- embeddings ---
    "fastembed==0.8.0",
    # --- llm gateway client (openai-compatible, points at the litellm proxy) ---
    "openai==3.5.0",
    # --- orchestration ---
    "jinja2==3.1.6",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    # --- entity resolution ---
    "rapidfuzz>=3.9,<4.0",
    "networkx==3.6.1",
    # --- resilience ---
    "tenacity==9.1.4",
    "pybreaker==1.4.1",
    # --- security / uploads ---
    "python-magic==0.4.27",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    # --- observability extras ---
    "openinference-instrumentation-langchain==0.1.72",
    # --- document parsing (BO-05) ---
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.165.10",
    "types-pyyaml",
]

[project.scripts]
graphrag = "graphrag.apps.cli.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graphrag"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["graphrag", "tests"]
# Only ever touch our own code — never the *.md spec documents (ARCHITECTURE/BLUEPRINT/BUILD_ORDER),
# which ruff's markdown-code-block formatting would otherwise happily rewrite.
include = ["graphrag/**/*.py", "tests/**/*.py", "scripts/**/*.py", "*.py"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "TID",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["graphrag"]

# `Depends(...)` as an argument default is how FastAPI's dependency injection works — not the
# B008 "mutable default" footgun the rule exists for.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ---------------------------------------------------------------------------
# mypy — strict on core/services/config only, per BLUEPRINT §0.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["graphrag.core.*", "graphrag.services.*", "graphrag.config.*"]
strict = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, no I/O (default)",
    "integration: requires the docker-compose stack (make up)",
    "contract: API/schema contract checks",
    "eval: requires live LLM provider keys, excluded from default runs",
    "llm_quota: quota-consuming tests excluded from the default run",
]
addopts = "-m 'not integration and not eval'"

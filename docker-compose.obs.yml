# Observability plane. `docker compose --profile core --profile obs up -d`.
# Dropping this file (i.e. omitting --profile obs) is the low-memory mode — there is no
# separate `lite` profile; core-only IS lite mode. Saves ~2GB of RAM.

services:
  otel-collector:
    # 0.160.0 does not exist as a released tag (only nightly builds do, as of 2026-08-28) —
    # pinned to the latest actual stable release instead. Built from otel/collector.Dockerfile,
    # which layers a static busybox onto the base image so the healthcheck below has something
    # to exec — see that file for why: the base image ships FROM SCRATCH with no shell/tools.
    build:
      context: ./otel
      dockerfile: collector.Dockerfile
    profiles: [obs]
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    mem_limit: 512m
    depends_on:
      otel-lgtm:
        condition: service_started
      phoenix:
        condition: service_started
    healthcheck:
      test: ["CMD", "/tools/busybox", "nc", "-z", "127.0.0.1", "4318"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  otel-lgtm:
    image: grafana/otel-lgtm@sha256:d6b20e35890ef2f91d13944805939acdaf1e5d3ffbf9f9aed08586312826c815
    profiles: [obs]
    ports:
      - "3000:3000"
      # Loki and Tempo's own HTTP APIs — published so TrailBuilder (BO-02) can query them
      # directly. It runs from the host (the CLI is `uv run graphrag trail`, and integration
      # tests run via `uv run pytest`, neither inside the compose network), so it cannot reach
      # them through Grafana's proxy at :3000 or through the container-only hostname.
      - "3100:3100"
      - "3200:3200"
    mem_limit: 1.5g
    healthcheck:
      # This image ships curl, not wget (confirmed against grafana/otel-lgtm:latest).
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phoenix:
    # Pinned by digest, not `:latest` — a floating tag silently swapped Phoenix's own image
    # under a Postgres schema written by an older version, and the newer image's migrations
    # choked against it (PhoenixMigrationError). Digest pinning makes `docker compose up`
    # deterministic: the same file always pulls the same bytes, so this can't recur silently.
    image: arizephoenix/phoenix@sha256:8af594ab0342cc32acc4167f472fb89b4e25f5eb8d5e26c353bf4e102fddb693
    profiles: [obs]
    ports:
      - "6006:6006"
    environment:
      # Its OWN database, not graphrag's (`${POSTGRES_DSN}`) — sharing `public` with graphrag
      # and LiteLLM meant no one tool could be reset/migrated without touching the others'
      # tables. `postgres/init/01-databases.sql` creates this database on a fresh volume.
      PHOENIX_SQL_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/phoenix
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      # Same fix as litellm (BLUEPRINT §1): the image has no shell/curl/wget, but it does run
      # on its own bundled python3.13 — use that instead of a shell probe.
      test:
        [
          "CMD",
          "python3.13",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:6006', timeout=3).status==200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

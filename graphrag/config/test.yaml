# Test-environment overrides (APP_ENV=test). Deep-merged onto base.yaml.
# Goal: deterministic, network-free unit tests — no telemetry export, no caching (a cached
# result would make the second run of a test assert against the cache instead of the system).

app:
  debug: true

cache:
  embedding: { enabled: false, ttl_s: 2592000, prefix: "emb:" }
  retrieval: { enabled: false, ttl_s: 900, prefix: "ret:" }
  llm: { enabled: false, ttl_s: 3600, semantic: false }

observability:
  traces:
    enabled: false
    record_prompts: false
  metrics:
    enabled: false
  logs:
    # false here means "skip the OTLP export handler" (telemetry/logging.py), not "stop
    # logging" — configure_logging() always installs the stdout renderer regardless of this
    # flag. Without this override, every unit test that calls configure_logging() would try a
    # real OTLP export to the (nonexistent, in a unit-test run) collector and eat a retry/
    # backoff cycle per call — exactly the non-determinism this file's module docstring says
    # to avoid.
    enabled: false
  phoenix:
    enabled: false
  trail:
    enabled: false

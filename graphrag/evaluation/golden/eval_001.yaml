    - d1fd89de-06a0-55ea-95c1-3b9a8cb9c6dd
    gold_answer: "The M5 Ultra features a highly scaled up-to-36-core CPU with 12 super cores and 24 performance cores. In contrast, the M6 features a 12-core CPU complex consisting of 2 super cores, 4 performance cores, and 6 efficiency cores. To support AI workloads, the M6 utilizes up to 32GB of unified memory specifically designed to run Large Language Models (LLMs) on-device for private, agentic tasks."
    must_refuse: false


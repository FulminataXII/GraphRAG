-   id: th-002
    question: "Across the newest generation of Apple silicon, how do the CPU core architectures of the M6 and M5 Ultra chips differ, and how does the memory architecture of the M6 specifically support advanced artificial intelligence workloads?"
    category: thematic
    gold_route: hybrid
    gold_chunk_ids: 

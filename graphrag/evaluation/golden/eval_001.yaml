    category: thematic
    gold_route: hybrid
    gold_chunk_ids: []
    gold_answer: "Arthur D. Levinson brings a deep background in biomedical sciences, holding a BS in molecular biology from the University of Washington (1972) and a PhD in biomedical sciences from Princeton University (1977), later leading biotechnology ventures Genentech and Calico. In contrast, John Ternus brings engineering and hardware design expertise, holding a bachelor's degree in Mechanical Engineering from the University of Pennsylvania and working at Virtual Research Systems before joining Apple's product design team in 2001."
    must_refuse: false

-   id: th-007
    question: "How do Apple's manufacturing initiatives in Bengaluru, India and Houston, Texas illustrate distinct facets of its global production and assembly operations?"
    category: thematic
    gold_route: hybrid
    gold_chunk_ids: []
    gold_answer: "Apple's international manufacturing strategy has involved establishing regional consumer device assembly, such as initiating production of the iPhone 7 at its Bengaluru facility in April 2019. In contrast, Apple's domestic strategy emphasizes advanced infrastructure and centralized desktop hardware, utilizing its Houston facility to house the Advanced Manufacturing Center (AMC), build and ship advanced AI servers, and manufacture the new Mac mini."
    must_refuse: false

-   id: th-008
    question: "How does Apple scale its \"super core\" CPU architecture across different performance tiers in the M6 and M5 Ultra chips?"
    category: thematic
    gold_route: hybrid
    gold_chunk_ids: []
    gold_answer: "Apple scales the super core implementation according to machine class: for standard desktop computing, the M6 introduces a 12-core CPU complex that features 2 super cores (along with 4 performance cores and 6 efficiency cores). For high-end professional workstation computing, the M5 Ultra significantly scales this design to an up-to-36-core CPU incorporating 12 super cores and 24 performance cores to achieve 1.3x higher multithreaded performance over the M3 Ultra."
    must_refuse: false

-   id: th-009
    question: "How do the outcomes of Apple's historical acquisition of NeXT compare with the joint development trajectory of Calico and AbbVie described in the documents?"
    category: thematic
    gold_route: hybrid
    gold_chunk_ids: []
    gold_answer: "Apple's acquisition of NeXT for $427 million successfully integrated the NeXTSTEP operating system into Apple's product foundation and restored founder Steve Jobs to the company's executive leadership lineage. In contrast, the life sciences collaboration between AbbVie and Alphabet venture Calico (led by Apple chairman Arthur D. Levinson) did not reach commercialization and was terminated by AbbVie in November 2025 following the clinical failure of fosigotifator in a Phase II/III trial for ALS."
    must_refuse: false


    gold_answer: "Apple is expanding its U.S. manufacturing footprint by investing hundreds of millions of dollars into a Houston facility to produce advanced AI servers, assemble the Mac mini, and host an Advanced Manufacturing Center. Through its American Manufacturing Program, the company is funding a $1.5 billion expansion with Broadcom in Fort Collins, Colorado, to manufacture advanced radio frequency components and wireless connectivity technologies, while training the workforce in AI and smart manufacturing at its Detroit Apple Manufacturing Academy. Across these initiatives, Apple has committed $600 billion with domestic partners to design and manufacture custom silicon, cover glass, and advanced components in the United States."

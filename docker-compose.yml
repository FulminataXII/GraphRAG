# Core data plane + gateway. `docker compose --profile core up -d`.
#
# NOTE on `litellm`: this BO (BO-00, skeleton only) declares the container so the compose
# topology is complete from day one. `litellm/config.yaml` here is a deliberate BO-00 stub
# (one placeholder model, no real provider key) — just enough for the container to boot and
# reach healthy. BO-06 replaces it with the real model_list, key rotation, fallback chains,
# rpm/tpm caps and the OTel callback; no app service calls the gateway yet either.
#
# ~4.75GB total across the 5 core services (qdrant 1g + neo4j 1500m + postgres 512m +
# redis 256m + litellm 1500m) — measured minimums, not guesses.
#
# `worker`/`projection-worker` land in BO-05.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    profiles: [core]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    profiles: [core]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 256M
    volumes:
      - neo4j_data:/data
    mem_limit: 1500m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  postgres:
    image: postgres:16
    profiles: [core]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    profiles: [core]
    ports:
      - "6379:6379"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  litellm:
    image: ghcr.io/berriai/litellm@sha256:af0152ca6dfb6703b35c0d4899effa9ac132bce9a4fbcbe1dc6ef145c100db26
    profiles: [core]
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: ${POSTGRES_DSN}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1500m
    healthcheck:
      # The image is Chainguard wolfi-base, which ships no curl/wget — a shell-based probe
      # can't work here. Use the Python interpreter that's already in the image instead.
      # /health/liveliness (not /health) is deliberate: /health probes every configured
      # provider and would fail against the placeholder key in this BO's stub config.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [core]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # base.yaml's stores.*/observability.* leaves already use container hostnames — these
      # exist to override config/local.yaml back to them, since APP_ENV=local (set in .env) also
      # pulls in local.yaml's HOST-facing localhost overrides (see local.yaml's comment). env
      # beats YAML in Settings' source precedence (BLUEPRINT §2.2), so this is the only place
      # that needs to know both consumers exist — no file toggling, no duplicated config.
      GRAPHRAG_OBSERVABILITY__OTLP_ENDPOINT: http://otel-collector:4317
      GRAPHRAG_OBSERVABILITY__TRAIL__LOKI_URL: http://otel-lgtm:3100
      GRAPHRAG_OBSERVABILITY__TRAIL__TEMPO_URL: http://otel-lgtm:3200
      GRAPHRAG_STORES__QDRANT__URL: http://qdrant:6333
      GRAPHRAG_STORES__NEO4J__URI: bolt://neo4j:7687
      GRAPHRAG_STORES__REDIS__URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  qdrant_data:
  neo4j_data:
  postgres_data:

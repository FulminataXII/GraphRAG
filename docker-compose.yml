# Core data plane + gateway. `docker compose --profile core up -d`.
#
# NOTE on `litellm`: BO-00 (skeleton only) declared the container with a stub config so the
# compose topology was complete from day one. BO-06 replaces `litellm/config.yaml` with the real
# model_list, key rotation, fallback chains, rpm/tpm caps and the OTel callback, and wires
# `llm_client` into the app — see litellm/config.yaml and graphrag/apps/api/main.py.
#
# ~4.75GB total across the 5 core services (qdrant 1g + neo4j 1500m + postgres 512m +
# redis 256m + litellm 1500m) — measured minimums, not guesses.
#
# `worker`/`projection-worker` (BO-05) share a bind-mounted `./data/uploads` directory with
# `api`: the worker resolves `IngestDocumentPayload.uri` back to bytes from there. This is a
# stand-in for real object storage — see `apps/worker/tasks/__init__.py`'s docstring for the
# spec gap it works around. A bind mount (not a named volume) is deliberate: the CLI's
# `ingest`/`seed` commands run on the HOST and write into the same `./data/uploads` path, so a
# host-launched `ingest` and the containerized worker agree on the same files.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    profiles: [core]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    profiles: [core]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 256M
    volumes:
      - neo4j_data:/data
    mem_limit: 1500m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Integration-test Neo4j. A SECOND instance, not a second database: Neo4j Community Edition
  # supports exactly one user database (`CREATE DATABASE` answers "Unsupported administration
  # command"), so there is no per-run database to namespace into and `MATCH (n) DETACH DELETE n`
  # in a fixture would always be aimed at the same graph the corpus lives in. That is what
  # silently destroyed an ingested corpus once already. A separate instance on its own port and
  # its own volume is the namespace: `tests/integration/namespaces.py` points every integration
  # fixture here, and nothing else in the repo names port 7688, so a test cannot reach the real
  # graph even if a fixture is wrong.
  #
  # `test` profile, so `make up` does NOT start it — only `make test-int` does. Sized down hard
  # (256m heap / 128m pagecache against the real instance's 1g/256M): integration graphs are a
  # few dozen nodes, and this has to fit alongside the obs plane during `make test-int`.
  neo4j-test:
    image: neo4j:5-community
    profiles: [test]
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128M
    volumes:
      - neo4j_test_data:/data
    # 900m, not the 700m first tried: with heap 256m + pagecache 128m the container still
    # measured 581MiB under `make test-int` (83% of a 700m ceiling), and the remainder is JVM
    # overhead that does not shrink on demand. Host headroom is not the constraint here — the
    # minimum available during a full `make up obs=1 && make test-int` run was 1.7GiB — so the
    # cgroup ceiling is the only thing that could OOM-kill this, and 900m leaves it ~35% clear.
    mem_limit: 900m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  postgres:
    image: postgres:16
    profiles: [core]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only runs against an EMPTY data directory (postgres's own entrypoint convention) — a
      # volume that predates this already has its databases and is left untouched. Creates
      # `phoenix` and `litellm` alongside the app's own `${POSTGRES_DB}`, so each tool gets an
      # independently resettable/migratable database instead of sharing `public` with graphrag.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    profiles: [core]
    ports:
      - "6379:6379"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  litellm:
    image: ghcr.io/berriai/litellm@sha256:af0152ca6dfb6703b35c0d4899effa9ac132bce9a4fbcbe1dc6ef145c100db26
    profiles: [core]
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Its OWN database, not graphrag's (`${POSTGRES_DSN}`) — see the `postgres` service's
      # comment: each tool sharing this Postgres instance gets its own database so none can be
      # reset/migrated at the expense of the others' tables.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      # Provider keys — ONLY this container ever sees them (BO-06). api/worker hold only
      # secrets.litellm_virtual_key; see .env.example's header comment.
      GROQ_API_KEY_1: ${GROQ_API_KEY_1}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2}
      GEMINI_API_KEY_1: ${GEMINI_API_KEY_1}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2}
      # Numbered, like every other provider key. It used to arrive as the unnumbered
      # OPENROUTER_API_KEY while litellm/config.yaml declares os.environ/OPENROUTER_API_KEY_1,
      # so the name it asks for did not exist in the container and `judge-alt-vendor` resolved
      # only through LiteLLM's fallback to the conventional provider variable. That fallback is
      # undocumented behaviour, and judge-alt-vendor is the fallback TARGET for both
      # synth-quality and fast-low-latency, so it would have died quietly if it ever changed.
      # The `_1` suffix is the project convention even with one key, so adding a second is a
      # config change and never a rename.
      OPENROUTER_API_KEY_1: ${OPENROUTER_API_KEY_1}
      # OTel callback (litellm/config.yaml's `litellm_settings.callbacks: ["otel"]`) reads these
      # standard OTel env vars directly — this is a third-party binary, not our app, so it does
      # NOT go through graphrag/adapters/telemetry/otel.py or a GRAPHRAG_-prefixed setting.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1500m
    healthcheck:
      # The image is Chainguard wolfi-base, which ships no curl/wget — a shell-based probe
      # can't work here. Use the Python interpreter that's already in the image instead.
      # /health/readiness (not /health/liveliness) now that real provider keys are configured
      # (BO-06) — readiness actually calls each configured model_list deployment once, which is
      # exactly the check worth failing on; liveliness only proved the process was up.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=3).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [core]
    ports:
      - "8000:8000"
    environment:
      # Explicit GRAPHRAG_SECRETS__* passthrough (BO-06), NOT `env_file: .env` — that would
      # blanket-inject the WHOLE .env file, including GEMINI_API_KEY/GROQ_API_KEY*/
      # OPENROUTER_API_KEY (litellm-container-only; see .env.example's header comment), straight
      # into this process's environment. `Settings`' env_prefix="GRAPHRAG_" means it wouldn't
      # READ those unprefixed vars, but they'd still be sitting in os.environ, which is exactly
      # what test_no_provider_key_in_app_env exists to catch.
      APP_ENV: ${APP_ENV}
      GRAPHRAG_SECRETS__POSTGRES_DSN: ${GRAPHRAG_SECRETS__POSTGRES_DSN}
      GRAPHRAG_SECRETS__LITELLM_MASTER_KEY: ${GRAPHRAG_SECRETS__LITELLM_MASTER_KEY}
      GRAPHRAG_SECRETS__LITELLM_VIRTUAL_KEY: ${GRAPHRAG_SECRETS__LITELLM_VIRTUAL_KEY}
      GRAPHRAG_SECRETS__NEO4J_PASSWORD: ${GRAPHRAG_SECRETS__NEO4J_PASSWORD}
      GRAPHRAG_SECRETS__ADMIN_API_KEY: ${GRAPHRAG_SECRETS__ADMIN_API_KEY}
      # base.yaml's stores.*/observability.* leaves already use container hostnames — these
      # exist to override config/local.yaml back to them, since APP_ENV=local (set in .env) also
      # pulls in local.yaml's HOST-facing localhost overrides (see local.yaml's comment). env
      # beats YAML in Settings' source precedence (BLUEPRINT §2.2), so this is the only place
      # that needs to know both consumers exist — no file toggling, no duplicated config.
      GRAPHRAG_OBSERVABILITY__OTLP_ENDPOINT: http://otel-collector:4317
      GRAPHRAG_OBSERVABILITY__TRAIL__LOKI_URL: http://otel-lgtm:3100
      GRAPHRAG_OBSERVABILITY__TRAIL__TEMPO_URL: http://otel-lgtm:3200
      GRAPHRAG_STORES__QDRANT__URL: http://qdrant:6333
      GRAPHRAG_STORES__NEO4J__URI: bolt://neo4j:7687
      GRAPHRAG_STORES__REDIS__URL: redis://redis:6379/0
      GRAPHRAG_LLM__GATEWAY_BASE_URL: http://litellm:4000/v1
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      # api calls ensure_schema() against Neo4j during Container.create(), so cold start
      # waits on Neo4j accepting connections. Measured ~60s cold; 90s leaves real headroom.
      start_period: 90s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [core]
    command: ["arq", "graphrag.apps.worker.settings.WorkerSettings"]
    environment:
      # See the `api` service's comment: explicit passthrough, not `env_file: .env` — this
      # process must never see GEMINI_API_KEY/GROQ_API_KEY*/OPENROUTER_API_KEY.
      APP_ENV: ${APP_ENV}
      GRAPHRAG_SECRETS__POSTGRES_DSN: ${GRAPHRAG_SECRETS__POSTGRES_DSN}
      GRAPHRAG_SECRETS__LITELLM_MASTER_KEY: ${GRAPHRAG_SECRETS__LITELLM_MASTER_KEY}
      GRAPHRAG_SECRETS__LITELLM_VIRTUAL_KEY: ${GRAPHRAG_SECRETS__LITELLM_VIRTUAL_KEY}
      GRAPHRAG_SECRETS__NEO4J_PASSWORD: ${GRAPHRAG_SECRETS__NEO4J_PASSWORD}
      GRAPHRAG_SECRETS__ADMIN_API_KEY: ${GRAPHRAG_SECRETS__ADMIN_API_KEY}
      GRAPHRAG_OBSERVABILITY__OTLP_ENDPOINT: http://otel-collector:4317
      GRAPHRAG_OBSERVABILITY__TRAIL__LOKI_URL: http://otel-lgtm:3100
      GRAPHRAG_OBSERVABILITY__TRAIL__TEMPO_URL: http://otel-lgtm:3200
      GRAPHRAG_STORES__QDRANT__URL: http://qdrant:6333
      GRAPHRAG_STORES__NEO4J__URI: bolt://neo4j:7687
      GRAPHRAG_STORES__REDIS__URL: redis://redis:6379/0
      GRAPHRAG_LLM__GATEWAY_BASE_URL: http://litellm:4000/v1
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      # arq ships its own health-check mode: it writes a heartbeat sentinel to Redis on the
      # cadence set by WorkerSettings.health_check_interval (10s — see that class's docstring
      # for why it must stay below this interval) and `--check` just reads it back, so this
      # needs no HTTP endpoint of its own.
      test: ["CMD", "arq", "--check", "graphrag.apps.worker.settings.WorkerSettings"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 30s

  projection-worker:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [core]
    command: ["arq", "graphrag.apps.worker.settings.ProjectionWorkerSettings"]
    environment:
      # See the `api` service's comment: explicit passthrough, not `env_file: .env` — this
      # process must never see GEMINI_API_KEY/GROQ_API_KEY*/OPENROUTER_API_KEY.
      APP_ENV: ${APP_ENV}
      GRAPHRAG_SECRETS__POSTGRES_DSN: ${GRAPHRAG_SECRETS__POSTGRES_DSN}
      GRAPHRAG_SECRETS__LITELLM_MASTER_KEY: ${GRAPHRAG_SECRETS__LITELLM_MASTER_KEY}
      GRAPHRAG_SECRETS__LITELLM_VIRTUAL_KEY: ${GRAPHRAG_SECRETS__LITELLM_VIRTUAL_KEY}
      GRAPHRAG_SECRETS__NEO4J_PASSWORD: ${GRAPHRAG_SECRETS__NEO4J_PASSWORD}
      GRAPHRAG_SECRETS__ADMIN_API_KEY: ${GRAPHRAG_SECRETS__ADMIN_API_KEY}
      GRAPHRAG_OBSERVABILITY__OTLP_ENDPOINT: http://otel-collector:4317
      GRAPHRAG_OBSERVABILITY__TRAIL__LOKI_URL: http://otel-lgtm:3100
      GRAPHRAG_OBSERVABILITY__TRAIL__TEMPO_URL: http://otel-lgtm:3200
      GRAPHRAG_STORES__QDRANT__URL: http://qdrant:6333
      GRAPHRAG_STORES__NEO4J__URI: bolt://neo4j:7687
      GRAPHRAG_STORES__REDIS__URL: redis://redis:6379/0
      GRAPHRAG_LLM__GATEWAY_BASE_URL: http://litellm:4000/v1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "arq", "--check", "graphrag.apps.worker.settings.ProjectionWorkerSettings"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 30s

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_test_data:
  postgres_data:
